apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: order-service-prod
resources:
  - ../../base
  - configmap.yaml
images:
  - name: order-service
    newTag: prod-latest
replicas:
  - name: order-service
    count: 3
# No secretGenerator here -- production secrets are created out-of-band by
# platform engineering, not sourced from files in this repo.
